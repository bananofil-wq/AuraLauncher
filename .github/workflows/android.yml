name: Build Aura Launcher APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-1.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AuraLauncher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: Aura Launcher 1.0
          files: release/AuraLauncher.apk
          make_latest: true
          prerelease: false
